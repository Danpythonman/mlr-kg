[project]
name = "mlr-kg"
version = "0.1.0"
description = "Knowledge graph of MLR review comments on PDF materials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=3.0,<3.1",
    "pyarrow>=14",
    "pymupdf==1.27.2.3",   # text extraction differs between versions; pinned so builds reproduce
    "pyyaml>=6",
    "rapidfuzz>=3.5",
]

[project.scripts]
mlr-kg = "mlr_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlr_kg"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905", "B007"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
